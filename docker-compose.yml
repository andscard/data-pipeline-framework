services:
    postgres:
        image: postgres:15
        container_name: framework_postgres
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-pipeline_db}
            POSTGRES_USER: ${POSTGRES_USER:-admin}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-JLjB77R1SCSrF5ZwNECG9Q}
            POSTGRES_INITDB_ARGS: '-E UTF8 --locale=en_US.UTF-8'
        ports:
            - '5433:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-pipeline_db}',
                ]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

volumes:
    postgres_data:
        driver: local
        name: framework_postgres_data

