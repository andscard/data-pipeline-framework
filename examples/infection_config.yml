# ============================================================================
# CONFIGURACIÓN DE INFECCIÓN DE DATOS - Data Pipeline Framework
# ============================================================================
#
# Este módulo inyecta vulnerabilidades en datos limpios para prueba de seguridad.
#
# FLUJO:
#   1. Leer datos limpios (customers.csv, transactions.csv)
#   2. Aplicar ataques configurados (Injection, XSS, outliers, etc.)
#   3. Guardar datos infectados
#
# ============================================================================

# Semilla para reproducibilidad
random_seed: 42

# Configuración global
global:
  # Tasa base de infección si no se especifica por ataque
  default_infection_rate: 0.20  # 20%
  
  # Modo de infección
  mode: "mixed"  # mixed | targeted | random
  
  # Preservar registros originales (útil para comparación)
  keep_clean_marker: true  # Agrega columna "_is_infected"

# ============================================================================
# DESTINOS DE SALIDA (Output Targets)
# ============================================================================
output_targets:
  # Guardar en archivos CSV
  csv:
    enabled: true
    path: "data/samples/"
  
  # Guardar en PostgreSQL
  postgres:
    enabled: true
    schema: "sample_data"
    connection:
      host: "${POSTGRES_HOST}"
      port: "${POSTGRES_PORT}"
      database: "${POSTGRES_DB}"
      user: "${POSTGRES_USER}"
      password: "${POSTGRES_PASSWORD}"
    if_exists: "replace"
    create_schema_if_not_exists: true

# ============================================================================
# DATASETS A INFECTAR
# ============================================================================
datasets:
  
  # --------------------------------------------------------------------------
  # CUSTOMERS DATASET
  # --------------------------------------------------------------------------
  customers:
    input: "data/samples/customers.csv"
    
    output:
      csv_file: "customers_infected.csv"
      postgres_table: "customers_infected"
    
    columns:
      - customer_id
      - name
      - email
      - phone
      - address
      - registration_date
      - last_login
      - account_status
      - lifetime_value
      - user_comment
      - website
      - ip_address
      - credit_card_last4
      - age
      - postal_code
    
    attacks:
      
      # ---------------- INJECTION ATTACKS ----------------
      
      - name: "Generic Injection Mix"
        type: "injection"
        target_columns: [name, user_comment, address]
        rate: 0.15
        
      - name: "XSS (Cross-Site Scripting)"
        type: "xss"
        target_columns: [name, user_comment, website]
        rate: 0.10
      
      - name: "Path Traversal"
        type: "path_traversal"
        target_columns: [user_comment, website]
        rate: 0.10
      
      # ---------------- DATA LEAKAGE ----------------
      
      - name: "Data Leakage Exposure"
        type: "data_leakage"
        target_columns: [user_comment, address]
        rate: 0.10
      
      # ---------------- NETWORK / SSRF ----------------
      
      - name: "SSRF Attacks"
        type: "ssrf"
        target_columns: [website, user_comment]
        rate: 0.10
      
      # ---------------- DATA QUALITY / LOGIC ----------------
      
      - name: "Negative Amounts"
        type: "negative_value"
        target_columns: [age, lifetime_value]
        rate: 0.05
        
      - name: "Format Corruption"
        type: "format_corruption"
        target_columns: [email, phone]
        rate: 0.10
        
      - name: "Invalid Dates"
        type: "inconsistency"
        target_columns: [registration_date, last_login]
        rate: 0.10
        
      - name: "Orphaned References"
        type: "orphaned_reference"
        target_columns: [customer_id]
        rate: 0.02
        
      - name: "Cross Field Logical Errors"
        type: "cross_field_violation"
        rate: 0.05

  # --------------------------------------------------------------------------
  # TRANSACTIONS DATASET
  # --------------------------------------------------------------------------
  transactions:
    input: "data/samples/transactions.csv"
    
    output:
      csv_file: "transactions_infected.csv"
      postgres_table: "transactions_infected"
      
    columns:
      - transaction_id
      - customer_id
      - timestamp
      - amount
      - category
      - status
      - description
      - merchant_name
      - payment_method
      - ip_address
      
    attacks:
      - name: "Negative Amounts"
        type: "negative_value"
        target_columns: [amount]
        rate: 0.10
        
      - name: "Outliers"
        type: "outliers"
        target_columns: [amount]
        rate: 0.05
        
      - name: "Duplicated Transactions"
        type: "duplicates"
        rate: 0.05
        
      - name: "Future Dates"
        type: "timing"
        target_columns: [timestamp]
        rate: 0.05
